name: ci

# Code paths only: in the data repo the daily data commits shouldn't spend
# Actions minutes on a build.
on:
  push:
    branches: [main]
    paths: ["web/**", "scripts/**", ".github/workflows/ci.yml"]
  pull_request:
    paths: ["web/**", "scripts/**", ".github/workflows/ci.yml"]

permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm test
      - run: npm run build
